<style id="app-style">
  :root {
    --bg: #eef1f4;
    --surface: #f8fafb;
    --surface-alt: #e3e9ed;
    --ink: #202632;
    --muted: #5b6472;
    --line: #d3dae0;
    --accent: #2c4a6e;
    --accent-ink: #ffffff;
    --accent-soft: #dce6ef;
    --seal: #ab3b32;
    --seal-soft: #f3ded9;
    --shadow: 0 1px 2px rgba(32, 38, 50, 0.06), 0 6px 20px rgba(32, 38, 50, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181d;
      --surface: #1b2028;
      --surface-alt: #191d24;
      --ink: #e7ebee;
      --muted: #98a2ad;
      --line: #2c333c;
      --accent: #8fb3d9;
      --accent-ink: #10161d;
      --accent-soft: #22344a;
      --seal: #e28579;
      --seal-soft: #3a2420;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181d;
    --surface: #1b2028;
    --surface-alt: #191d24;
    --ink: #e7ebee;
    --muted: #98a2ad;
    --line: #2c333c;
    --accent: #8fb3d9;
    --accent-ink: #10161d;
    --accent-soft: #22344a;
    --seal: #e28579;
    --seal-soft: #3a2420;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans SC', 'Hiragino Sans', 'PingFang SC', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button, input, textarea, select { font: inherit; color: inherit; }
  ::selection { background: var(--accent-soft); }

  #app {
    display: flex;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 236px;
    flex: none;
    background: var(--surface-alt);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 22px 16px;
    gap: 22px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .seal-mark {
    width: 34px; height: 34px; flex: none;
    background: var(--seal);
    color: #fff;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Shippori Mincho', serif;
    font-size: 18px;
    font-weight: 700;
    box-shadow: var(--shadow);
  }
  .brand-text h1 {
    margin: 0;
    font-family: 'Shippori Mincho', 'Noto Serif SC', serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .brand-text p {
    margin: 1px 0 0;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  nav.tabs { display: flex; flex-direction: column; gap: 4px; }
  .tab-btn {
    display: flex; align-items: center; gap: 10px;
    background: transparent; border: none;
    padding: 9px 10px;
    border-radius: 8px;
    text-align: left;
    cursor: pointer;
    color: var(--ink);
    font-size: 0.76rem;
    font-weight: 500;
  }
  .tab-btn .ic { width: 18px; flex: none; opacity: 0.8; }
  .tab-btn:hover { background: var(--surface); }
  .tab-btn[aria-current="true"] {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .sidebar-stat {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 0.72rem;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  .stat-count {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 1.4rem;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .status-row { display: flex; align-items: center; gap: 6px; }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    flex: none;
  }
  .status-dot.on { background: var(--accent); }
  .backup-row { display: flex; gap: 10px; }
  .backup-btn {
    background: none; border: none; padding: 0;
    color: var(--muted); font-size: 0.72rem; text-decoration: underline;
    cursor: pointer; font-family: inherit;
  }
  .backup-btn:hover { color: var(--ink); }
  .backup-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Main ---------- */
  main {
    flex: 1;
    min-width: 0;
    padding: 34px 44px 60px;
  }
  .view-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .view-header h2 {
    font-family: 'Shippori Mincho', 'Noto Serif SC', serif;
    font-size: 1.7rem;
    margin: 0;
    text-wrap: balance;
  }
  .view-header .sub { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  .content-wrap { max-width: 760px; }

  /* ---------- List controls ---------- */
  .list-controls {
    display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap;
  }
  .search-box {
    position: relative;
    flex: 1;
    min-width: 200px;
  }
  .search-box input {
    width: 100%;
    padding: 9px 12px 9px 34px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
  }
  .search-box input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .search-box .ic {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    opacity: 0.55; pointer-events: none;
  }
  .sort-btn {
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    cursor: pointer;
    font-size: 0.82rem;
    white-space: nowrap;
  }
  .sort-btn:hover { border-color: var(--accent); }

  /* ---------- Entry cards ---------- */
  .entry-list { display: flex; flex-direction: column; gap: 10px; }
  .entry-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px 12px;
    align-items: start;
  }
  .entry-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .entry-jp {
    font-family: 'Shippori Mincho', 'Noto Serif SC', serif;
    font-size: 1.35rem;
    font-weight: 700;
  }
  .entry-reading {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: 'Noto Sans SC', sans-serif;
  }
  .entry-pos {
    font-size: 0.68rem;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 1px 6px;
    letter-spacing: 0.04em;
  }
  .entry-zh { font-size: 1rem; font-weight: 500; margin-top: 2px; white-space: pre-wrap; }
  .entry-notes { font-size: 0.83rem; color: var(--muted); margin-top: 3px; white-space: pre-wrap; }
  .entry-meta {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 0.68rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    grid-column: 1 / -1;
    margin-top: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .entry-actions { display: flex; gap: 4px; }
  .icon-btn {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.72rem;
  }
  .icon-btn:hover { background: var(--surface-alt); color: var(--ink); }
  .icon-btn.danger { color: var(--seal); }
  .icon-btn.danger.confirming { background: var(--seal-soft); border-color: var(--seal); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .empty-state {
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
  }
  .empty-state .big { font-family: 'Shippori Mincho', serif; font-size: 1.1rem; color: var(--ink); margin-bottom: 6px; }
  .empty-state button { margin-top: 14px; }

  /* ---------- Form ---------- */
  form.entry-form { display: flex; flex-direction: column; gap: 16px; max-width: 520px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 0.8rem; font-weight: 500; }
  .field label .opt { color: var(--muted); font-weight: 400; }
  .field input, .field textarea, .field select {
    padding: 9px 11px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
  }
  .field input.jp-input { font-family: 'Shippori Mincho', serif; font-size: 1.1rem; }
  .field textarea { resize: vertical; min-height: 56px; }
  .field input:focus-visible, .field textarea:focus-visible, .field select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .field .err {
    color: var(--seal);
    font-size: 0.76rem;
    display: none;
  }
  .field.invalid input, .field.invalid textarea { border-color: var(--seal); }
  .field.invalid .err { display: block; }
  .form-actions { display: flex; gap: 10px; align-items: center; }

  .btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 500;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border-color: var(--line);
  }
  .btn.ghost:hover { border-color: var(--accent); }

  /* ---------- Help ---------- */
  .help-section { margin-bottom: 26px; }
  .help-section h3 {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.05rem;
    margin: 0 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .help-section h3::before {
    content: "";
    width: 4px; height: 16px;
    background: var(--seal);
    border-radius: 2px;
    display: inline-block;
  }
  .help-section p, .help-section li { color: var(--ink); font-size: 0.9rem; }
  .help-section ol, .help-section ul { margin: 6px 0; padding-left: 20px; }
  .kbd {
    font-family: 'JetBrains Mono', monospace;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.78rem;
  }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: var(--ink);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    box-shadow: var(--shadow);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
    z-index: 20;
  }
  #toast.show { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    #toast { transition: none; }
  }

  @media (max-width: 720px) {
    #app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; flex-direction: row; align-items: center; }
    .sidebar-stat { margin-top: 0; margin-left: auto; border-top: none; padding-top: 0; }
    nav.tabs { flex-direction: row; }
    main { padding: 24px 18px 40px; }
  }
</style>

<script id="app-script">
(function () {
  "use strict";

  var STORAGE_KEY = "kotobacho-entries-v1";
  var SCROLL_STORAGE_KEY = "kotobacho-list-scroll-v1";

  function readSavedListScroll() {
    try {
      var raw = localStorage.getItem(SCROLL_STORAGE_KEY);
      var n = raw ? parseInt(raw, 10) : 0;
      return isNaN(n) ? 0 : n;
    } catch (e) { return 0; }
  }

  function saveListScroll(y) {
    try { localStorage.setItem(SCROLL_STORAGE_KEY, String(y)); } catch (e) { /* storage unavailable — silently skip */ }
  }

  function readEmbeddedEntries() {
    try {
      var raw = document.getElementById("entries-json").textContent;
      return JSON.parse(raw || "[]");
    } catch (e) {
      return [];
    }
  }

  function readLocalEntries() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  function saveLocalEntries(entries) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    } catch (e) { /* storage unavailable — silently skip */ }
  }

  var state = {
    entries: readLocalEntries() || readEmbeddedEntries(),
    view: "list",
    query: "",
    sort: "recent",
    editingId: null,
    pendingDelete: null,
    // Reopening the page should drop you back where you left off in 詞典
    // (the list view), not at the top — seed this from the last position
    // persisted below, and see the scroll listener + restore call near the
    // bottom of this file for the write/read side of that.
    savedScroll: readSavedListScroll()
  };

  var mode = "local"; // becomes "artifact" once the capability resolves
  var artifactApi = null;

  // ---------- helpers ----------

  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function genId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "e-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function formatDate(iso) {
    try {
      var d = new Date(iso);
      var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
      var hh = String(d.getHours()).padStart(2, "0"), mm = String(d.getMinutes()).padStart(2, "0");
      return y + "-" + m + "-" + day + " " + hh + ":" + mm;
    } catch (e) { return ""; }
  }

  var collator = (window.Intl && Intl.Collator) ? new Intl.Collator("ja") : null;

  function sortedFilteredEntries() {
    var q = state.query.trim().toLowerCase();
    var list = state.entries.filter(function (e) {
      if (!q) return true;
      return [e.jp, e.reading, e.zh, e.notes].some(function (f) {
        return (f || "").toLowerCase().indexOf(q) !== -1;
      });
    });
    list = list.slice();
    if (state.sort === "alpha") {
      list.sort(function (a, b) {
        var ka = a.reading || a.jp || "", kb = b.reading || b.jp || "";
        return collator ? collator.compare(ka, kb) : ka.localeCompare(kb);
      });
    } else {
      list.sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
    }
    return list;
  }

  // ---------- persistence ----------

  function safeEntriesJson(entries) {
    return JSON.stringify(entries).replace(/</g, "\\u003c");
  }

  function pageHTML(entries) {
    var styleSrc = document.getElementById("app-style").textContent;
    var scriptSrc = document.getElementById("app-script").textContent;
    var head = [
      '<meta charset="UTF-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1">',
      '<meta name="color-scheme" content="light dark">',
      "<title>言葉帳</title>",
      '<link rel="preconnect" href="https://fonts.googleapis.com">',
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">',
      '<style id="app-style">' + styleSrc + "</style>"
    ].join("\n");
    var body = [
      '<div id="app"></div>',
      '<script id="entries-json" type="application/json">' + safeEntriesJson(entries) + "<\/script>",
      '<script id="app-script">' + scriptSrc + "<\/script>"
    ].join("\n");
    return "<!doctype html>\n<html lang=\"zh\">\n<head>\n" + head + "\n</head>\n<body>\n" + body + "\n</body>\n</html>";
  }

  function setStatus(text, connected) {
    var dot = document.getElementById("status-dot");
    var label = document.getElementById("status-label");
    if (dot) dot.classList.toggle("on", !!connected);
    if (label) label.textContent = text;
  }

  function persist() {
    saveLocalEntries(state.entries);
    if (mode === "artifact" && artifactApi) {
      artifactApi.publish(pageHTML(state.entries)).then(function () {
        // a successful publish reloads this view automatically
      }).catch(function (err) {
        var code = err && err.code;
        if (code === "conflict") {
          // another version is already on its way in; nothing to do
        } else if (code === "not_writer" || code === "not_granted" || code === "capability_disabled" || code === "not_declared" || code === "capability_removed") {
          mode = "local";
          setStatus("僅保存在本設備", false);
          showToast("此詞典為只讀,改動僅保存在本設備瀏覽器中");
        } else {
          showToast("保存失敗,請稍後重試");
        }
      });
    }
  }

  // ---------- backup (export / import) ----------
  //
  // Entries only ever live in this browser's localStorage (or get baked into
  // a published artifact). Opening the file straight from a phone/desktop
  // file manager has no such sync, so these buttons are the escape hatch:
  // export dumps state.entries to a downloadable .json, import merges one
  // back in — a byte-for-byte duplicate is skipped, a word that already
  // exists but was edited differently elsewhere has its missing fields
  // filled in (rather than creating a second card for the same word), and
  // anything genuinely new is added.

  function entryKey(e) {
    return [e.jp, e.reading, e.pos, e.zh, e.notes].map(function (v) { return v || ""; }).join("␟");
  }

  // Identity of a "word" independent of its pos/zh/notes content, so an
  // incoming entry can be recognized as the same word even when those
  // fields differ from what's already stored.
  function identityKey(e) {
    return [e.jp, e.reading].map(function (v) { return v || ""; }).join("␟");
  }

  function exportBackup() {
    var stamp = new Date().toISOString().slice(0, 10);
    var defaultName = "kotobacho-backup-" + stamp + ".json";
    var blob = new Blob([JSON.stringify(state.entries, null, 2)], { type: "application/json" });

    // Browsers never let a page write to an arbitrary path a user types in —
    // that's blocked for security. The File System Access API's native
    // "Save As" dialog is the closest the web platform allows: the user
    // browses to any folder and names the file there. Only Chromium
    // browsers over a secure context (https, not a plain file:// open)
    // support it; everywhere else we fall back to prompting for just a
    // filename and letting the browser save it to its default downloads
    // location.
    if (window.showSaveFilePicker && window.isSecureContext) {
      window.showSaveFilePicker({
        suggestedName: defaultName,
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
      }).then(function (handle) {
        return handle.createWritable().then(function (writable) {
          return writable.write(blob).then(function () { return writable.close(); });
        });
      }).then(function () {
        showToast("已導出 " + state.entries.length + " 個詞條");
      }).catch(function (err) {
        if (err && err.name === "AbortError") return; // user cancelled the dialog
        showToast("導出失敗,請稍後重試");
      });
      return;
    }

    var name = window.prompt("導出檔案名稱(將存到瀏覽器預設下載位置):", defaultName);
    if (name === null) return; // user cancelled
    name = name.trim().replace(/[\\/]/g, "") || defaultName;
    if (!/\.json$/i.test(name)) name += ".json";

    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast("已導出 " + state.entries.length + " 個詞條");
  }

  function importBackup(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var incoming;
      try {
        incoming = JSON.parse(String(reader.result));
      } catch (e) {
        showToast("導入失敗:文件不是有效的 JSON");
        return;
      }
      if (!Array.isArray(incoming)) {
        showToast("導入失敗:文件格式不正確");
        return;
      }
      var existingExactKeys = {};
      var existingByIdentity = {};
      state.entries.forEach(function (e) {
        existingExactKeys[entryKey(e)] = true;
        existingByIdentity[identityKey(e)] = e;
      });
      var added = 0, merged = 0;
      incoming.forEach(function (raw) {
        if (!raw || typeof raw !== "object") return;
        var jp = String(raw.jp || "").trim();
        var zh = String(raw.zh || "").trim();
        if (!jp || !zh) return;
        var incoming_ = {
          jp: jp,
          reading: String(raw.reading || "").trim(),
          pos: String(raw.pos || "").trim(),
          zh: zh,
          notes: String(raw.notes || "").trim(),
          createdAt: (typeof raw.createdAt === "string" && raw.createdAt) || new Date().toISOString()
        };
        if (existingExactKeys[entryKey(incoming_)]) return; // byte-for-byte duplicate

        var existing = existingByIdentity[identityKey(incoming_)];
        if (existing) {
          // Same word already in the dictionary, but pos/zh/notes differ —
          // fold in whatever the existing entry is missing rather than
          // adding a duplicate card or dropping the incoming content.
          var changed = false;
          ["pos", "zh", "notes"].forEach(function (field) {
            if (!existing[field] && incoming_[field]) {
              existing[field] = incoming_[field];
              changed = true;
            }
          });
          if (changed) {
            existingExactKeys[entryKey(existing)] = true;
            merged++;
          }
          return;
        }

        var entry = {
          id: genId(),
          jp: incoming_.jp,
          reading: incoming_.reading,
          pos: incoming_.pos,
          zh: incoming_.zh,
          notes: incoming_.notes,
          createdAt: incoming_.createdAt
        };
        existingExactKeys[entryKey(entry)] = true;
        existingByIdentity[identityKey(entry)] = entry;
        state.entries.push(entry);
        added++;
      });
      if (added > 0 || merged > 0) {
        persist();
        renderApp();
      }
      var summary = [];
      if (added > 0) summary.push("已導入 " + added + " 個新詞條");
      if (merged > 0) summary.push("補全了 " + merged + " 個詞條的內容");
      showToast(summary.length ? summary.join(",") : "沒有新內容(可能已全部存在)");
    };
    reader.onerror = function () { showToast("導入失敗:無法讀取文件"); };
    reader.readAsText(file);
  }

  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(function (api) {
      if (api) {
        artifactApi = api;
        mode = "artifact";
        setStatus("詞典已連接", true);
      } else {
        setStatus("僅保存在本設備", false);
      }
    }).catch(function () {
      setStatus("僅保存在本設備", false);
    });
  } else {
    setStatus("僅保存在本設備", false);
  }

  // ---------- scroll position (詞典 page) ----------
  //
  // Persist how far down the list you've scrolled so reopening the page
  // later drops you back at the same spot instead of the top. Attached
  // once here (not inside bindEvents/renderApp) since it targets window,
  // not any element that gets torn down on re-render.

  var scrollSaveScheduled = false;
  window.addEventListener("scroll", function () {
    if (state.view !== "list") return;
    if (scrollSaveScheduled) return;
    scrollSaveScheduled = true;
    requestAnimationFrame(function () {
      scrollSaveScheduled = false;
      state.savedScroll = window.scrollY;
      saveListScroll(state.savedScroll);
    });
  }, { passive: true });

  // ---------- toast ----------

  var toastTimer = null;
  function showToast(msg) {
    var el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2600);
  }

  // ---------- rendering ----------

  function renderSidebar() {
    var count = state.entries.length;
    return (
      '<aside class="sidebar">' +
        '<div class="brand">' +
          '<div class="seal-mark">辭</div>' +
          '<div class="brand-text"><h1>言葉帳</h1><p>日 &rarr; 中 詞典</p></div>' +
        "</div>" +
        '<nav class="tabs" aria-label="視圖切換">' +
          tabBtn("list", "詞典", "&#128214;") +
          tabBtn("add", "添加詞條", "&#65291;") +
          tabBtn("help", "幫助", "&#10067;") +
        "</nav>" +
        '<div class="sidebar-stat">' +
          '<div><div class="stat-count">' + count + "</div>詞條</div>" +
          '<div class="status-row"><span id="status-dot" class="status-dot"></span><span id="status-label">正在連接&hellip;</span></div>' +
          '<div class="backup-row">' +
            '<button class="backup-btn" data-action="export-backup">導出備份</button>' +
            '<button class="backup-btn" data-action="import-backup">導入備份</button>' +
          "</div>" +
          '<input type="file" id="import-file-input" accept="application/json,.json" hidden>' +
        "</div>" +
      "</aside>"
    );
  }

  function tabBtn(id, label, glyph) {
    var current = state.view === id;
    return '<button class="tab-btn" data-view="' + id + '"' + (current ? ' aria-current="true"' : "") + '><span class="ic" aria-hidden="true">' + glyph + "</span>" + label + "</button>";
  }

  function renderEntryCard(e) {
    var confirming = state.pendingDelete === e.id;
    return (
      '<article class="entry-card" data-id="' + e.id + '">' +
        '<div>' +
          '<div class="entry-head">' +
            '<span class="entry-jp">' + escapeHtml(e.jp) + "</span>" +
            (e.reading ? '<span class="entry-reading">〔' + escapeHtml(e.reading) + "〕</span>" : "") +
            (e.pos ? '<span class="entry-pos">' + escapeHtml(e.pos) + "</span>" : "") +
          "</div>" +
          '<div class="entry-zh">' + escapeHtml(e.zh) + "</div>" +
          (e.notes ? '<div class="entry-notes">' + escapeHtml(e.notes) + "</div>" : "") +
        "</div>" +
        '<div class="entry-actions">' +
          '<button class="icon-btn" data-action="edit" data-id="' + e.id + '">編輯</button>' +
          '<button class="icon-btn danger' + (confirming ? " confirming" : "") + '" data-action="delete" data-id="' + e.id + '">' + (confirming ? "確認刪除" : "刪除") + "</button>" +
        "</div>" +
        '<div class="entry-meta"><span>添加於 ' + formatDate(e.createdAt) + "</span></div>" +
      "</article>"
    );
  }

  function renderListBody() {
    var list = sortedFilteredEntries();
    if (state.entries.length === 0) {
      return '<div class="empty-state"><div class="big">詞典還是空的</div>還沒有任何詞條,先去添加你遇到的第一個日語單詞吧。' +
        '<div><button class="btn" data-action="goto-add">添加詞條</button></div></div>';
    } else if (list.length === 0) {
      return '<div class="empty-state"><div class="big">沒有找到匹配的詞條</div>換一個關鍵詞試試,或清空搜索框查看全部詞條。</div>';
    }
    return '<div class="entry-list">' + list.map(renderEntryCard).join("") + "</div>";
  }

  function renderList() {
    return (
      '<div class="view-header"><div><h2>詞典</h2><div class="sub">共收錄 ' + state.entries.length + ' 個詞條</div></div></div>' +
      '<div class="content-wrap">' +
        '<div class="list-controls">' +
          '<div class="search-box"><span class="ic" aria-hidden="true">&#128269;</span>' +
          '<input id="search-input" type="search" placeholder="搜索日文、假名或中文釋義&#8203; (按 / 快速定位)" value="' + escapeHtml(state.query) + '" aria-label="搜索詞條"></div>' +
          '<button class="sort-btn" data-action="toggle-sort">' + (state.sort === "recent" ? "按添加時間 &darr;" : "按假名排序 A&rarr;Z") + "</button>" +
        "</div>" +
        '<div id="list-body">' + renderListBody() + "</div>" +
      "</div>"
    );
  }

  function field(labelText, opt, inner, errId, errMsg) {
    return (
      '<div class="field" id="field-' + errId + '">' +
        "<label>" + labelText + (opt ? ' <span class="opt">(選填)</span>' : "") + "</label>" +
        inner +
        '<div class="err" id="err-' + errId + '">' + errMsg + "</div>" +
      "</div>"
    );
  }

  function renderAdd() {
    var e = state.editingId ? state.entries.find(function (x) { return x.id === state.editingId; }) : null;
    var v = e || { jp: "", reading: "", zh: "", pos: "", notes: "" };
    var heading = e ? "編輯詞條" : "添加詞條";
    return (
      '<div class="view-header"><div><h2>' + heading + '</h2></div>' +
        '<div class="form-actions">' +
          '<button type="submit" form="entry-form" class="btn">' + (e ? "保存修改" : "添加詞條") + "</button>" +
          (e ? '<button type="button" class="btn ghost" data-action="cancel-edit">取消編輯</button>' : '<button type="reset" form="entry-form" class="btn ghost" data-action="clear-form">清空</button>') +
        "</div>" +
      "</div>" +
      '<div class="content-wrap">' +
      '<form class="entry-form" id="entry-form" novalidate>' +
        field("日本語", false, '<input class="jp-input" type="text" id="f-jp" placeholder="例:ありがとう" value="' + escapeHtml(v.jp) + '" autocomplete="off">', "jp", "請輸入日語原詞") +
        field("読み方 / 假名讀音", true, '<input type="text" id="f-reading" placeholder="例:ありがとう" value="' + escapeHtml(v.reading) + '" autocomplete="off">', "reading", "") +
        field("中文釋義", false, '<textarea id="f-zh" placeholder="例:謝謝" rows="2">' + escapeHtml(v.zh) + "</textarea>", "zh", "請輸入中文釋義") +
        field("詞性", true,
          '<select id="f-pos">' +
            ["", "名", "動", "形", "副", "其他"].map(function (p) {
              return '<option value="' + p + '"' + (v.pos === p ? " selected" : "") + ">" + (p || "不指定") + "</option>";
            }).join("") +
          "</select>", "pos", "") +
        field("例句 / 備註", true, '<textarea id="f-notes" placeholder="用法、例句或其他備註" rows="2">' + escapeHtml(v.notes) + "</textarea>", "notes", "") +
      "</form>" +
      "</div>"
    );
  }

  function renderHelp() {
    return (
      '<div class="view-header"><div><h2>幫助</h2><div class="sub">關於「言葉帳」的使用說明</div></div></div>' +
      '<div class="content-wrap">' +
        '<div class="help-section"><h3>關於本應用</h3>' +
          "<p>「言葉帳」是一本由你親手建立的日語&rarr;中文詞典。遇到不認識的日語單詞時隨手記下,應用會把所有詞條整理成列表,方便日後查閱、搜索與複習。</p></div>" +

        '<div class="help-section"><h3>如何添加詞條</h3>' +
          "<ol>" +
            "<li>點擊左側「添加詞條」。</li>" +
            "<li>填寫「日本語」(必填,如 ありがとう)與「中文釋義」(必填,如 謝謝)。</li>" +
            "<li>「読み方」「詞性」「例句/備註」均為選填,用於補充讀音、詞性或用法說明。</li>" +
            "<li>點擊「添加詞條」保存;表單會自動清空,方便連續輸入下一條。</li>" +
          "</ol></div>" +

        '<div class="help-section"><h3>如何查看與搜索</h3>' +
          "<ul>" +
            "<li>點擊「詞典」查看全部詞條,默認按添加時間排列,點擊排序按鈕可切換為按假名讀音排序。</li>" +
            "<li>在搜索框中輸入日文、假名或中文關鍵詞即可即時篩選。</li>" +
            '<li>按 <span class="kbd">/</span> 鍵可從任意頁面快速跳轉到搜索框。</li>' +
          "</ul></div>" +

        '<div class="help-section"><h3>如何編輯與刪除</h3>' +
          "<ul>" +
            "<li>點擊詞條卡片上的「編輯」可修改內容後保存。</li>" +
            "<li>點擊「刪除」會先變為「確認刪除」,再次點擊才會真正移除,避免誤刪;若不確認,幾秒後會自動還原。</li>" +
          "</ul></div>" +

        '<div class="help-section"><h3>數據如何保存</h3>' +
          "<p>左下角的狀態指示會告訴你當前的保存方式:</p>" +
          "<ul>" +
            "<li><strong>詞典已連接</strong>&mdash;&mdash;所有添加、編輯、刪除都會保存到這本詞典本身,任何打開這個頁面的人看到的都是同一份內容。</li>" +
            "<li><strong>僅保存在本設備</strong>&mdash;&mdash;改動只寫入這台設備這個瀏覽器的本地存儲,不會同步給其他人;清除瀏覽器數據會導致詞條丟失,請留意。</li>" +
          "</ul></div>" +

        '<div class="help-section"><h3>備份與遷移</h3>' +
          "<p>左下角的「導出備份」會把當前所有詞條打包成一個 .json 文件下載下來;「導入備份」可以選擇這樣的文件,把裡面的詞條合並進來:完全相同的詞條不會重複導入,同一個詞在兩邊內容不同時會自動補齊缺少的欄位,不會產生重複卡片。</p>" +
          "<p>如果你在多台設備(比如電腦和手機)上分別直接打開這個文件添加詞條,它們的本地存儲是互相獨立的&mdash;&mdash;請定期在每台設備上導出備份,再導入到另一台設備上合併,避免詞條只留在一處。</p></div>" +
      "</div>"
    );
  }

  function renderApp() {
    var main;
    if (state.view === "add") main = renderAdd();
    else if (state.view === "help") main = renderHelp();
    else main = renderList();

    document.getElementById("app").innerHTML =
      renderSidebar() +
      "<main>" + main + "</main>" +
      '<div id="toast" role="status" aria-live="polite"></div>';

    setStatus(mode === "artifact" ? "詞典已連接" : "僅保存在本設備", mode === "artifact");
    bindEvents();
  }

  // ---------- events ----------

  function switchView(view) {
    var restoreScroll = state.view === "add" && state.editingId && view === "list";
    state.view = view;
    if (view !== "add") state.editingId = null;
    renderApp();
    if (view === "list") {
      if (restoreScroll) window.scrollTo(0, state.savedScroll);
      var input = document.getElementById("search-input");
      // preventScroll so focusing an off-screen input doesn't undo the
      // scroll restore above.
      if (input && state.query) input.focus(restoreScroll ? { preventScroll: true } : undefined);
    } else if (view === "add") {
      var jp = document.getElementById("f-jp");
      if (jp) jp.focus();
    }
  }

  // Binds the actions that live inside #list-body (edit/delete/goto-add).
  // Called after a full renderApp() and also after an in-place list-body
  // refresh from search input, so it never needs to touch #search-input.
  function bindListBodyEvents() {
    var app = document.getElementById("app");

    var gotoAdd = app.querySelector('[data-action="goto-add"]');
    if (gotoAdd) gotoAdd.addEventListener("click", function () { switchView("add"); });

    app.querySelectorAll('[data-action="edit"]').forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.editingId = btn.dataset.id;
        state.savedScroll = window.scrollY;
        switchView("add");
      });
    });

    app.querySelectorAll('[data-action="delete"]').forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.dataset.id;
        if (state.pendingDelete === id) {
          var entry = state.entries.find(function (x) { return x.id === id; });
          state.entries = state.entries.filter(function (x) { return x.id !== id; });
          state.pendingDelete = null;
          renderApp();
          persist();
          showToast(entry ? "已刪除「" + entry.jp + "」" : "已刪除");
        } else {
          // Toggle the button in place rather than a full renderApp(): the
          // 3s auto-revert below runs on a bare timer, unrelated to any
          // user action, and could otherwise land mid-keystroke in the
          // search box and re-trigger the IME composition bug.
          state.pendingDelete = id;
          btn.classList.add("confirming");
          btn.textContent = "確認刪除";
          setTimeout(function () {
            if (state.pendingDelete === id) {
              state.pendingDelete = null;
              btn.classList.remove("confirming");
              btn.textContent = "刪除";
            }
          }, 3000);
        }
      });
    });
  }

  function bindEvents() {
    var app = document.getElementById("app");

    app.querySelectorAll(".tab-btn").forEach(function (btn) {
      btn.addEventListener("click", function () { switchView(btn.dataset.view); });
    });

    var searchInput = document.getElementById("search-input");
    if (searchInput) {
      // Patch only #list-body on input, leaving #search-input itself in
      // place. A full renderApp() here would tear down and recreate the
      // input mid-keystroke, which breaks IME composition (e.g. typing
      // Chinese/Japanese pinyin/kana) and scrambles what you're typing.
      var refreshList = function () {
        state.query = searchInput.value;
        var listBody = document.getElementById("list-body");
        if (listBody) {
          listBody.innerHTML = renderListBody();
          bindListBodyEvents();
        }
      };
      searchInput.addEventListener("input", function (evt) {
        if (evt.isComposing) return;
        refreshList();
      });
      searchInput.addEventListener("compositionend", refreshList);
    }

    var sortBtn = app.querySelector('[data-action="toggle-sort"]');
    if (sortBtn) {
      sortBtn.addEventListener("click", function () {
        state.sort = state.sort === "recent" ? "alpha" : "recent";
        renderApp();
      });
    }

    bindListBodyEvents();

    var exportBtn = app.querySelector('[data-action="export-backup"]');
    if (exportBtn) exportBtn.addEventListener("click", exportBackup);

    var importFileInput = document.getElementById("import-file-input");
    var importBtn = app.querySelector('[data-action="import-backup"]');
    if (importBtn && importFileInput) {
      importBtn.addEventListener("click", function () { importFileInput.click(); });
      importFileInput.addEventListener("change", function () {
        var file = importFileInput.files && importFileInput.files[0];
        importFileInput.value = "";
        if (file) importBackup(file);
      });
    }

    var cancelEdit = app.querySelector('[data-action="cancel-edit"]');
    if (cancelEdit) cancelEdit.addEventListener("click", function () { switchView("list"); });

    var form = document.getElementById("entry-form");
    if (form) {
      form.addEventListener("keydown", function (evt) {
        // Enter in a single-line field would otherwise implicitly submit the
        // form; only textareas should treat Enter as a line break.
        if (evt.key === "Enter" && evt.target.tagName !== "TEXTAREA") {
          evt.preventDefault();
        }
      });
      form.addEventListener("submit", function (evt) {
        evt.preventDefault();
        var jp = document.getElementById("f-jp").value.trim();
        var reading = document.getElementById("f-reading").value.trim();
        var pos = document.getElementById("f-pos").value;
        var zh = document.getElementById("f-zh").value.trim();
        var notes = document.getElementById("f-notes").value.trim();

        var valid = true;
        toggleFieldError("jp", !jp); if (!jp) valid = false;
        toggleFieldError("zh", !zh); if (!zh) valid = false;
        if (!valid) return;

        if (state.editingId) {
          var e = state.entries.find(function (x) { return x.id === state.editingId; });
          if (e) { e.jp = jp; e.reading = reading; e.pos = pos; e.zh = zh; e.notes = notes; }
          persist();
          switchView("list");
          showToast("已保存修改");
        } else {
          state.entries.push({ id: genId(), jp: jp, reading: reading, pos: pos, zh: zh, notes: notes, createdAt: new Date().toISOString() });
          persist();
          switchView("add");
          showToast("已添加「" + jp + "」");
        }
      });
    }

    var clearBtn = app.querySelector('[data-action="clear-form"]');
    if (clearBtn) {
      clearBtn.addEventListener("click", function () {
        setTimeout(function () {
          ["jp", "zh"].forEach(function (id) { toggleFieldError(id, false); });
        }, 0);
      });
    }
  }

  function toggleFieldError(id, isInvalid) {
    var field = document.getElementById("field-" + id);
    if (field) field.classList.toggle("invalid", isInvalid);
  }

  document.addEventListener("keydown", function (evt) {
    if (evt.key !== "/") return;
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    evt.preventDefault();
    if (state.view !== "list") { switchView("list"); }
    var input = document.getElementById("search-input");
    if (input) input.focus();
  });

  renderApp();
  if (state.view === "list" && state.savedScroll > 0) {
    // rAF so this runs after the browser has laid out the freshly rendered
    // list — scrolling immediately can land short if fonts/layout haven't
    // settled yet.
    requestAnimationFrame(function () { window.scrollTo(0, state.savedScroll); });
  }
})();
</script>
</body>
</html>
